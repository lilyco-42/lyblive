[package]
name = "lyblive"
version = "0.2.1"
edition = "2021"
publish = false
description = "lyblive B 站直播助手：lilyco 命令面、MCP、TUI 与 shadcn Web 控制台"

[features]
default = ["tui", "browser", "obs"]
tui = ["lilyco/tui"]
browser = ["dep:webbrowser"]
obs = []
headless = []

[dependencies]
base64 = "0.22"
lilyco = { git = "https://github.com/lilyco-42/lilyco", tag = "v0.3.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
include_dir = "0.7"
mime_guess = "2"
md-5 = "0.10"
hex = "0.4"
qrcodegen = "1.8"
tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
flate2 = "1.1"
brotli = "8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
urlencoding = "2"
futures-util = "0.3"
async-stream = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
webbrowser = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.dev]
opt-level = 0
incremental = true
codegen-units = 256
debug = 0
